<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <div data-ui="weather-display">
      <h1>
        Showing the weather for <span data-ui="location" class="location">Lahore</span>.
      </h1>

      <div data-ui="weather"></div>
    </div>

    <form data-action="get-weather-for-location">
      <label for="location">
        Type location to get weather for:
        <input type="text" id="location" />
      </label>
      <button>Go</button>
    </form>
  </body>
</html>
