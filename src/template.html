<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <div data-ui="weather-display">
      <header class="flex">
        <h1>
          Showing the weather for
          <span data-ui="location" class="capitalize-text">Lahore</span>.
        </h1>

        <button
          class="capitalize-text"
          data-action="toggle-temperature-scale"
          data-temperature-scale="fahrenheit"
        >
          Fahrenheit
        </button>
      </header>

      <div data-ui="weather"></div>

      <p data-ui="error-message" class="display-none"></p>
    </div>

    <form data-action="get-weather-for-location">
      <label for="location">
        Type location to get weather for:
        <input type="text" id="location" />
      </label>
      <button>Go</button>
    </form>
  </body>
</html>
