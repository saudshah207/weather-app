<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Weather App</title><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><button class="temperature-scale-toggle capitalize-text button secondary-button" data-action="toggle-temperature-scale" data-temperature-scale="fahrenheit">Fahrenheit</button><div data-ui="weather-display" class="weather-display flex flex-column align-items-center center-text standard-gap"><h1><span data-ui="location" class="capitalize-text standard-padding">Lahore</span></h1><div data-ui="weather"></div><div data-ui="loading" class="display-none"><p>Loading...</p></div><p data-ui="error-message" class="display-none standard-padding"></p><ul data-ui="forecast" class="forecast list-style-none grid standard-gap standard-inline-padding"></ul></div><form data-action="get-weather-for-location" class="weather-location-form flex flex-wrap standard-gap standard-inline-padding"><label for="location" class="flex flex-wrap flex-grow standard-gap">Type location to get weather for: <input id="location" class="weather-location-input" required/></label> <button class="button primary-button">Go</button></form></body></html>
